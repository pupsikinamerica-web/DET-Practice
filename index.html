<script data-app>
// Students: add, switch and remove profiles. Each profile keeps its own progress, mistakes and seen items.
(function () {
  const { esc, store } = App;
  const COLORS = ["#9069cd", "#1cb0f6", "#58cc02", "#ff9600", "#ff4b4b", "#ce82ff", "#2fb47a", "#e8a33d"];
  const list = () => store.get("students") || [];
  const save = l => store.set("students", l);
  const current = () => list().find(s => s.id === store.get("current"));

  // A student's own file (window.LOCK) holds exactly one profile and cannot switch or edit it.
  const LOCK = window.LOCK;
  if (LOCK) { save([LOCK.student]); store.set("current", LOCK.student.id); }
  if (!list().length) { const s = { id: "s" + Date.now(), name: "Ученик 1", c: COLORS[0] }; save([s]); store.set("current", s.id); }
  if (!current()) store.set("current", list()[0].id);
  App.currentStudent = current;

  const css = document.createElement("style");
  css.dataset.inj = "1";
  css.textContent = `
  .who{position:relative}
  .who-btn{display:flex;align-items:center;gap:10px;background:none;border:2px solid var(--line);border-radius:14px;padding:4px 12px 4px 4px;cursor:pointer;font:inherit;font-weight:800;color:var(--ink)}
  .who-btn:hover{background:var(--soft)}
  .who-btn .avatar{flex:0 0 auto}
  .who-menu{position:absolute;right:0;top:calc(100% + 8px);width:300px;max-width:calc(100vw - 32px);background:var(--card);border:2px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.08);padding:12px;z-index:20}
  .who-menu h4{margin:4px 6px 10px;font-size:14px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  .who-row{display:flex;align-items:center;gap:10px;padding:6px;border-radius:12px}
  .who-row.on{background:var(--blue-soft)}
  .who-row .nm{flex:1;min-width:0;background:none;border:none;text-align:left;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 0}
  .who-row .x{background:none;border:none;color:var(--faint);font-size:20px;cursor:pointer;padding:0 6px}
  .who-row .x:hover{color:var(--red)}
  .who-ask{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--red-dark)}
  .who-ask button{border:none;border-radius:8px;padding:4px 10px;font:inherit;font-weight:800;cursor:pointer}
  .who-add{display:flex;gap:8px;margin-top:10px;border-top:2px solid var(--line);padding-top:12px}
  .who-add input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:15px;color:var(--ink);background:var(--soft)}
  .who-add input:focus{outline:none;border-color:#84d8ff;background:var(--card)}
  .who-add .btn{padding:8px 14px;font-size:13px}
  .now{display:inline-flex;align-items:center;gap:8px;background:var(--blue-soft);color:var(--blue-dark);border-radius:10px;padding:4px 12px;font-weight:800;font-size:14px;margin-bottom:12px}
  @media (max-width:520px){.who-btn .who-name{display:none}.who-btn{padding:4px}}`;
  document.head.appendChild(css);

  const av = s => `<span class="avatar" style="background:${s.c}">${esc((s.name.trim()[0] || "?").toUpperCase())}</span>`;

  function menu(box) {
    const cur = current();
    box.innerHTML = `<h4>Ученики</h4>
      ${list().map(s => `<div class="who-row ${s.id === cur.id ? "on" : ""}" data-id="${s.id}">${av(s)}
        <button class="nm" data-act="pick">${esc(s.name)}</button>
        ${list().length > 1 ? `<button class="x" data-act="ask" title="Удалить ученика" aria-label="Удалить ${esc(s.name)}">×</button>` : ""}</div>`).join("")}
      <form class="who-add" id="who-add"><input id="who-new" maxlength="30" placeholder="Имя нового ученика" aria-label="Имя нового ученика"><button class="btn green" type="submit">Добавить</button></form>`;
    box.querySelectorAll(".who-row").forEach(row => {
      const id = row.dataset.id;
      row.querySelector('[data-act="pick"]').onclick = () => { store.set("current", id); App.sound && App.sound("tap"); App.hub(); };
      const x = row.querySelector('[data-act="ask"]');
      if (x) x.onclick = e => {
        e.stopPropagation();
        const s = list().find(s => s.id === id);
        x.outerHTML = `<span class="who-ask">Удалить вместе с прогрессом?<button data-act="yes" style="background:var(--red);color:#fff">Да</button><button data-act="no" style="background:var(--line);color:var(--ink)">Нет</button></span>`;
        row.querySelector('[data-act="yes"]').onclick = () => {
          store.wipe(id);
          const rest = list().filter(t => t.id !== id); save(rest);
          if (store.get("current") === id) store.set("current", rest[0].id);
          App.hub(); openMenu();
        };
        row.querySelector('[data-act="no"]').onclick = () => menu(box);
      };
    });
    box.querySelector("#who-add").onsubmit = e => {
      e.preventDefault();
      const name = box.querySelector("#who-new").value.trim();
      if (!name) return box.querySelector("#who-new").focus();
      const s = { id: "s" + Date.now(), name, c: COLORS[list().length % COLORS.length] };
      save(list().concat(s)); store.set("current", s.id);
      App.sound && App.sound("correct");
      App.hub();
    };
  }
  function openMenu() {
    const box = document.getElementById("who-menu");
    if (!box) return;
    box.hidden = false; menu(box);
  }

  const origHub = App.hub;
  App.hub = function () {
    origHub();
    const cur = current();
    const old = document.querySelector(".topbar .avatar");
    if (old) old.outerHTML = `<div class="who"><button class="who-btn" id="who-btn" aria-haspopup="true">${av(cur)}<span class="who-name">${esc(cur.name)}</span></button><div class="who-menu" id="who-menu" hidden></div></div>`;
    const btn = document.getElementById("who-btn"), box = document.getElementById("who-menu");
    if (LOCK) { box.remove(); btn.style.cursor = "default"; btn.title = "Личный файл ученика"; }
    else btn.onclick = e => { e.stopPropagation(); if (box.hidden) openMenu(); else box.hidden = true; };
    if (!LOCK) { box.onclick = e => e.stopPropagation(); document.onclick = () => { box.hidden = true; }; }
    const h1 = document.querySelector(".hero h1");
    if (h1) h1.insertAdjacentHTML("beforebegin", `<div class="now">${av(cur).replace('class="avatar"', 'class="avatar" style="width:22px;height:22px;font-size:12px;background:' + cur.c + '"')}Занимается: ${esc(cur.name)}</div>`);
  };
})();

</script>
<script data-app>
// Student report: score history chart, per-section table, frequent mistakes, mock exams.
(function () {
  const { esc, store } = App;
  const $ = id => document.getElementById(id);
  const COL = { select: "#1cb0f6", blanks: "#58cc02", ctest: "#ff9600", ireading: "#9069cd", photo: "#ff4b4b", wsample: "#ce82ff", iwriting: "#2fb47a" };
  const fmt = d => d ? d.slice(8, 10) + "." + d.slice(5, 7) : "";

  function chart(h) {
    const W = 640, H = 240, L = 40, R = 12, T = 14, B = 30;
    const xs = i => L + (h.length < 2 ? (W - L - R) / 2 : i * (W - L - R) / (h.length - 1));
    const ys = v => T + (1 - (v - 10) / 150) * (H - T - B);
    let g = "";
    [10, 60, 110, 160].forEach(v => g += `<line x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${ys(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`);
    const ids = [...new Set(h.map(x => x.id))].filter(id => COL[id]);
    ids.forEach(id => {
      const pts = h.map((x, i) => x.id === id ? [xs(i), ys(x.score)] : null).filter(Boolean);
      if (pts.length > 1) g += `<polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="${COL[id]}" stroke-width="2.5" stroke-linejoin="round"/>`;
      pts.forEach(p => g += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${COL[id]}" stroke="var(--card)" stroke-width="2"/>`);
    });
    const step = Math.max(1, Math.ceil(h.length / 8));
    h.forEach((x, i) => { if (i % step === 0 || i === h.length - 1) g += `<text x="${xs(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmt(x.date)}</text>`; });
    const legend = ids.map(id => `<span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700"><i style="width:12px;height:12px;border-radius:50%;background:${COL[id]}"></i>${esc(App.SECTIONS.find(s => s.id === id).name)}</span>`).join("");
    return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:480px;height:auto">${g}</svg></div><div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:8px">${legend}</div>`;
  }

  App.report = function () {
    const who = App.currentStudent ? App.currentStudent() : { name: "" };
    const h = store.get("history") || [], mocks = store.get("mocks") || [], deck = store.get("mistakes") || [];
    const secs = App.SECTIONS.filter(s => !s.hidden);
    const rows = secs.map(s => {
      const r = h.filter(x => x.id === s.id);
      return { s, n: r.length, last: r.length ? r[r.length - 1].score : null, best: r.length ? Math.max(...r.map(x => x.score)) : null, first: r.length ? r[0].score : null, date: r.length ? r[r.length - 1].date : "" };
    });
    const tried = rows.filter(r => r.n), never = rows.filter(r => !r.n);
    const weak = tried.slice().sort((a, b) => a.last - b.last)[0];
    const top = deck.slice().sort((a, b) => (b.misses || 1) - (a.misses || 1)).slice(0, 12);
    const days = new Set(h.map(x => x.date)).size;

    const tips = [];
    const strong = tried.length > 1 ? tried.slice().sort((a, b) => b.last - a.last).slice(0, 2).filter(r => r !== weak) : [];
    if (strong.length) tips.push(`<b style="color:var(--green-dark)">Сильные стороны:</b> ${strong.map(r => `${esc(r.s.name)} (≈${r.last})`).join(", ")}.`);
    if (weak) tips.push(`<b style="color:var(--red-dark)">Над чем поработать:</b> ${esc(weak.s.name)} (последний ориентир ≈${weak.last}).`);
    if (never.length) tips.push(`<b>Ещё не пробовали:</b> ${never.map(r => esc(r.s.name)).join(", ")}.`);
    const up = tried.filter(r => r.n > 1 && r.last > r.first);
    if (up.length) tips.push(`<b>Есть рост:</b> ${up.map(r => `${esc(r.s.name)} (+${r.last - r.first})`).join(", ")}.`);
    if (top.length) tips.push(`<b>На повторение:</b> ${top.length >= 12 ? "больше 12" : top.length} слов в «Работе над ошибками».`);
    if (!tips.length) tips.push("Пока нет данных: пройдите хотя бы один раздел.");

    document.getElementById("app").innerHTML = `<div class="res">
      <div class="res-actions" style="margin-bottom:16px"><button class="btn ghost" id="home">← Все разделы</button><button class="btn ghost" id="copyrep">Скопировать отчёт</button></div>
      <h1 style="font-size:28px;margin:0 0 4px">Отчёт: ${esc(who.name)}</h1>
      <div style="color:var(--muted);margin-bottom:16px">${h.length} попыток · ${days} дн. занятий · ${mocks.length} пробных экзаменов · ⭐ ${store.get("xp") || 0} XP</div>
      <div class="res-card"><h2>Выводы</h2><ul class="rec">${tips.map(t => `<li>${t}</li>`).join("")}</ul></div>
      <div class="res-card"><h2>Балл по датам</h2>${h.length ? chart(h.slice(-40)) : `<div style="color:var(--muted)">График появится после первых попыток.</div>`}</div>
      <div class="res-card"><h2>По разделам</h2><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:460px">
        <tr style="text-align:left;color:var(--muted);font-size:13px"><th style="padding:6px">Раздел</th><th>Попыток</th><th>Последний</th><th>Лучший</th><th>Изменение</th><th>Когда</th></tr>
        ${rows.map(r => `<tr style="border-top:2px solid var(--line)"><td style="padding:10px 6px;font-weight:700"><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${COL[r.s.id]};margin-right:8px"></i>${esc(r.s.name)}</td><td>${r.n || "—"}</td><td>${r.last ?? "—"}</td><td>${r.best ?? "—"}</td>
          <td style="font-weight:800;color:${r.n > 1 ? (r.last >= r.first ? "var(--green-dark)" : "var(--red-dark)") : "var(--muted)"}">${r.n > 1 ? (r.last - r.first >= 0 ? "+" : "") + (r.last - r.first) : "—"}</td><td style="color:var(--muted)">${fmt(r.date) || "—"}</td></tr>`).join("")}
      </table></div></div>
      <div class="res-card"><h2>Частые ошибки</h2>${top.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px">${top.map(c => `<span class="stat"><b style="font-size:16px;display:inline">${esc(c.w)}</b>${c.hint ? ` — ${esc(c.hint)}` : ""}${(c.misses || 1) > 1 ? ` <span style="color:var(--red-dark)">×${c.misses}</span>` : ""}</span>`).join("")}</div>` : `<div style="color:var(--muted)">Ошибок на повторение нет.</div>`}</div>
      <div class="res-card"><h2>Пробные экзамены</h2>${mocks.length ? mocks.slice(-10).map(m => `<div class="rev" style="grid-template-columns:70px minmax(0,1fr) 50px;align-items:center"><span style="color:var(--muted)">${fmt(m.date)}</span><div class="bar"><i style="width:${Math.round(m.score / 160 * 100)}%"></i></div><b>${m.score}</b></div>`).join("") : `<div style="color:var(--muted)">Пробных экзаменов ещё не было.</div>`}</div>
      <div class="res-card"><h2>Резервная копия</h2>
        <p style="color:var(--muted);margin:0 0 12px">Прогресс хранится в этом браузере. Если очистить историю или открыть файл в другом браузере, он пропадёт. Копия — на всякий случай, пользоваться ей не обязательно.</p>
        <div class="res-actions"><button class="btn ghost" id="bk-save">Сохранить копию</button><label class="btn ghost" for="bk-file" style="display:inline-block">Восстановить из копии</label><input type="file" id="bk-file" accept=".json,application/json" hidden></div>
        <div id="bk-msg" style="margin-top:8px;font-weight:700;color:var(--muted)"></div></div>
    </div>`;
    window.scrollTo(0, 0);
    $("home").onclick = () => App.hub();
    $("bk-save").onclick = async () => {
      const name = `DET backup - ${who.name.replace(/[\\/:*?"<>|]/g, "")} - ${App.today()}.json`;
      const data = JSON.stringify({ app: "det-practice", student: who.name, date: App.today(), data: store.dump() });
      const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      try {
        if (dl) await dl.save({ filename: name, data });
        else { const u = URL.createObjectURL(new Blob([data], { type: "application/json" })); const a = document.createElement("a"); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 5000); }
        $("bk-msg").textContent = `Копия сохранена: ${name}`;
      } catch (e) { $("bk-msg").textContent = e.code === "declined" ? "Сохранение отменено." : "Не удалось сохранить копию."; }
    };
    $("bk-file").onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const j = JSON.parse(await f.text());
        if (j.app !== "det-practice" || !j.data) throw 0;
        store.load(j.data);

    if (!tools) return;
    const k = known(), total = VOCAB.reduce((a, t) => a + t.w.length, 0), n = Object.values(k).filter(v => v === 1).length;
    tools.insertAdjacentHTML("beforeend", `<button class="task" id="t-vocab"><span class="task-ico" style="font-size:34px">📚</span><span class="task-body"><span class="task-name">Академическая лексика</span>
      <span class="task-desc" style="display:block">${VOCAB.length} тем, ${total} слов с переводом и примерами</span>
      <span class="task-meta"><span class="bar"><i style="width:${Math.round(n / total * 100)}%"></i></span><span class="task-count">${n}/${total}</span></span></span></button>`);
    $("t-vocab").onclick = topics;
  };
})();

</script>
<script data-app>
// Student file: a copy of the whole trainer locked to one student and carrying their homework.
(function () {
  // Snapshot of the page source taken before the app renders (injected styles left out).
  App.capture = function () {
    const c = document.documentElement.cloneNode(true);
    c.querySelectorAll("style[data-inj]").forEach(s => s.remove());
    c.querySelectorAll("script:not([data-app])").forEach(s => s.remove());
    const app = c.querySelector("#app"); if (app) app.innerHTML = "";
    App.SRC = "<!doctype html>\n" + c.outerHTML;
  };

  async function build() {
    const st = App.currentStudent(), hw = App.store.get("homework");
    if (hw && !hw.hwid) { hw.hwid = "h" + Date.now(); App.store.set("homework", hw); }
    const doc = new DOMParser().parseFromString(App.SRC, "text/html");
    doc.querySelectorAll("script[data-lock]").forEach(s => s.remove());
    // Scripts published as separate files are inlined so the file works on its own.
    for (const s of [...doc.querySelectorAll("script[data-app][src]")]) {
      const r = await fetch(s.getAttribute("src"));
      if (!r.ok) throw new Error("load " + s.getAttribute("src"));
      const n = doc.createElement("script"); n.setAttribute("data-app", ""); n.textContent = await r.text();
      s.replaceWith(n);
    }
    const lock = doc.createElement("script");
    lock.setAttribute("data-app", ""); lock.setAttribute("data-lock", "");
    lock.textContent = "window.LOCK=" + JSON.stringify({ student: st, homework: hw || null, issued: App.today() }).replace(/</g, "\\u003c") + ";";
    const first = doc.querySelector("script[data-app]");
    first.parentNode.insertBefore(lock, first);
    const t = doc.querySelector("title"); if (t) t.textContent = "DET practice — " + st.name;
    return { name: `DET practice - ${st.name.replace(/[\\/:*?"<>|]/g, "")}.html`, html: "<!doctype html>\n" + doc.documentElement.outerHTML };
  }

  App.buildStudentFile = build;
  App.exportStudent = async function (btn, msg) {
    btn.disabled = true; msg.textContent = "Готовлю файл…";
    try {
      const { name, html } = await build();
      const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if (dl) {
        try { await dl.save({ filename: name, data: html }); msg.textContent = `Файл «${name}» сохранён. Отправьте его ученику.`; }
        catch (e) { msg.textContent = e.code === "declined" ? "Сохранение отменено." : "Не удалось сохранить файл здесь. Откройте тренажёр из файла и попробуйте там."; }
      } else {
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        msg.textContent = `Файл «${name}» скачан. Отправьте его ученику.`;
      }
    } catch (e) {
      msg.textContent = "Не удалось собрать файл: " + (e.message || e);
    } finally { btn.disabled = false; }
  };
})();

</script>
<script data-app>
// "Сильные и слабые стороны" card on every section's results page.
(function () {
  const { esc } = App;
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const low = s => String(s || "").toLowerCase().replace(/_/g, "");
  function lev(a, b) {
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }

  function analyze(S) {
    const good = [], bad = [], L = S.log, id = S.sec.id;

    // Accuracy by difficulty level, for sections graded right/wrong.
    const graded = L.filter(e => typeof e.ok === "boolean");
    if (graded.length >= 4) {
      const by = {};
      graded.forEach(e => { (by[e.level] = by[e.level] || [0, 0])[1]++; if (e.ok) by[e.level][0]++; });
      const lv = Object.keys(by).map(Number).sort();
      const sure = lv.filter(l => by[l][1] >= 2 && by[l][0] / by[l][1] >= 0.75);
      const hard = lv.filter(l => by[l][1] >= 2 && by[l][0] / by[l][1] < 0.5);
      if (sure.length) good.push(`Уверенно решаете задания уровня ${sure.join(", ")} (${sure.map(l => `${by[l][0]} из ${by[l][1]}`).join(", ")}).`);
      if (hard.length) bad.push(`Уровень ${hard.join(", ")} пока сложен (${hard.map(l => `${by[l][0]} из ${by[l][1]}`).join(", ")}).`);
    }

    if (id === "select") {
      const real = L.filter(e => e.real), fake = L.filter(e => !e.real);
      const r = real.filter(e => e.ok).length, f = fake.filter(e => e.ok).length, to = L.filter(e => e.timeout).length;
      if (real.length) (r / real.length >= 0.8 ? good : bad).push(r / real.length >= 0.8
        ? `Хорошо узнаёте настоящие слова: ${r} из ${real.length}.`
        : `Не узнали ${real.length - r} из ${real.length} настоящих слов — нужен словарный запас.`);
      if (fake.length) (f / fake.length >= 0.8 ? good : bad).push(f / fake.length >= 0.8
        ? `Не попадаетесь на выдуманные слова: ${f} из ${fake.length}.`
        : `Приняли ${fake.length - f} выдуманных слов за настоящие — отвечайте «Yes», только если уверены.`);
      (to ? bad : good).push(to ? `Не успели ответить ${to} раз(а) — решайте быстрее.` : "Укладываетесь во время.");
    }

    if (id === "blanks" || id === "review") {
      const wrong = L.filter(e => !e.ok);
      const spell = wrong.filter(e => low(e.you).length >= low(e.right).length - 1 && lev(low(e.you), low(e.right)) <= 2);
      const ok = L.length - wrong.length;
      if (ok / L.length >= 0.7) good.push(`Правильно дописали ${ok} из ${L.length} слов — хорошо понимаете контекст.`);
      if (spell.length) bad.push(`Орфография: слово угадано, но с ошибкой (${spell.map(e => esc(e.right)).join(", ")}).`);
      else if (ok) good.push("Орфографических ошибок нет.");
      if (wrong.length - spell.length) bad.push(`Не вспомнили слово: ${wrong.filter(e => !spell.includes(e)).map(e => esc(e.right)).join(", ")}.`);
    }

    if (id === "ctest") {
      const items = L.flatMap(e => e.items), short = items.filter(x => x.w.length <= 4), long = items.filter(x => x.w.length >= 7);
      const s = short.filter(x => x.ok).length, lg = long.filter(x => x.ok).length;
      if (short.length) (s / short.length >= 0.7 ? good : bad).push(s / short.length >= 0.7 ? `Короткие слова (the, will, many…): ${s} из ${short.length}.` : `Короткие служебные слова: только ${s} из ${short.length} — это лёгкие баллы, не пропускайте их.`);
      if (long.length) (lg / long.length >= 0.6 ? good : bad).push(lg / long.length >= 0.6 ? `Длинные слова: ${lg} из ${long.length} — хороший словарный запас.` : `Длинные слова: ${lg} из ${long.length} — учите лексику по темам.`);
    }

    if (id === "ireading") {
      const gaps = L.flatMap(e => e.gaps), qs = L.flatMap(e => e.qs), g = gaps.filter(x => x.ok).length;
      (g / gaps.length >= 0.7 ? good : bad).push(`Слова в пропусках: ${g} из ${gaps.length} (${pct(g, gaps.length)}%).`);
      const kind = { passage: "недостающее предложение", highlight: "поиск ответа в тексте", idea: "главную мысль", detail: "детали", title: "заголовок" };
      Object.keys(kind).forEach(k => {
        const q = qs.filter(x => x.type === k); if (!q.length) return;
        const n = q.filter(x => x.ok).length;
        (n === q.length ? good : bad).push(`Вопросы на ${kind[k]}: ${n} из ${q.length}.`);
      });
    }

    if (["photo", "wsample", "iwriting"].includes(id)) {
      const W = L.filter(e => e.m), words = W.reduce((a, e) => a + e.m.words, 0);
      const target = W.reduce((a, e) => a + e.target, 0), links = [...new Set(W.flatMap(e => e.m.links))];
      const avg = W.reduce((a, e) => a + e.m.avg, 0) / (W.length || 1), ttr = W.reduce((a, e) => a + e.m.ttr, 0) / (W.length || 1);
      (words >= target ? good : bad).push(words >= target ? `Достаточный объём: ${words} слов при цели ${target}.` : `Мало текста: ${words} слов при цели ${target}.`);
      (links.length >= 3 ? good : bad).push(links.length >= 3 ? `Используете связки: ${esc(links.slice(0, 5).join(", "))}.` : "Почти нет связок (however, because, for example…).");
      (avg >= 11 ? good : bad).push(avg >= 11 ? "Пишете развёрнутые предложения." : "Предложения слишком короткие — соединяйте их.");
      if (ttr >= 0.6) good.push("Разнообразная лексика, мало повторов.");
      const reps = [...new Set(W.flatMap(e => e.m.repeats.map(([w]) => w)))];
      if (reps.length) bad.push(`Повторяются слова: ${esc(reps.slice(0, 4).join(", "))}.`);
      const iss = [...new Set(W.flatMap(e => e.m.issues))];
      if (iss.length) bad.push(`Оформление: ${esc(iss[0])}`);
    }

    return { good, bad };
  }

  const origResults = App.results;
  App.results = function (S, partial) {
    origResults(S, partial);
    if (!S.log.length) return;
    const { good, bad } = analyze(S);
    const cards = document.querySelectorAll(".res > .res-card");
    if (!cards.length) return;
    const list = (items, color, empty) => items.length
      ? `<ul class="rec">${items.map(t => `<li style="background:${color}">${t}</li>`).join("")}</ul>`
      : `<div style="color:var(--muted)">${empty}</div>`;
    cards[0].insertAdjacentHTML("afterend", `<div class="res-card"><h2>Сильные и слабые стороны</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px">
        <div style="min-width:0"><h3 style="margin:0 0 10px;font-size:16px;color:var(--green-dark)">💪 Получается</h3>${list(good, "var(--green-soft)", partial ? "Пока мало данных — пройдите раздел до конца." : "В этой попытке сильных сторон не видно. Это нормально: пройдите раздел ещё раз.")}</div>
        <div style="min-width:0"><h3 style="margin:0 0 10px;font-size:16px;color:var(--red-dark)">🎯 Над чем поработать</h3>${list(bad, "var(--red-soft)", "Слабых мест в этой попытке не видно.")}</div>
      </div></div>`);
  };
})();

</script>
<script data-app>App.capture(); App.start()</script>
