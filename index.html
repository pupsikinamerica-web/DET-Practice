<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body style="margin:0">
<title>English Test Practice Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: DET-style practice hub — sidebar + task cards; tasks open in a centered white exam card on a grey ground */
:root{
  --ground:#f0f0f0; --card:#ffffff; --ink:#4b4b4b; --muted:#777777; --faint:#afafaf;
  --line:#e5e5e5; --soft:#f7f7f7;
  --blue:#1cb0f6; --blue-dark:#1899d6; --blue-soft:#ddf4ff;
  --green:#58cc02; --green-dark:#58a700; --green-soft:#d7ffb8;
  --red:#ff4b4b; --red-dark:#ea2b2b; --red-soft:#ffdfe0;
  --gold:#ffc800;
  --font:"Nunito","Varela Round","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
button{font-family:inherit}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{background:var(--card);border-bottom:2px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.topbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:var(--green);letter-spacing:-.3px}
.logo-mark{width:30px;height:30px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff;font-size:15px;font-weight:900}
.avatar{width:32px;height:32px;border-radius:50%;background:#9069cd;color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}

/* ---------- hub ---------- */
.hub{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;
  padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{display:flex;flex-direction:column;gap:6px}
.side-item{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;border:2px solid transparent;
  font-weight:800;font-size:14px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.side-item.active{background:var(--blue-soft);border-color:#84d8ff;color:var(--blue)}
.side-ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:15px}
.main{min-width:0}
.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:28px;border-bottom:2px solid var(--line);margin-bottom:28px}
.hero h1{font-size:30px;line-height:1.2;font-weight:800;margin:0 0 8px;text-wrap:balance}
.hero p{margin:0 0 18px;color:var(--muted);max-width:52ch}
.hero-art{flex:0 0 190px;height:120px;border-radius:16px;background:linear-gradient(160deg,var(--green-soft),#e9ffd9);position:relative;overflow:hidden}
.hero-art .scr{position:absolute;left:34px;top:22px;width:120px;height:76px;background:var(--blue-soft);border:6px solid #cfcfcf;border-radius:8px}
.hero-art .scr::after{content:"";position:absolute;left:30px;top:16px;width:40px;height:22px;border:5px solid var(--gold);border-bottom:none;border-radius:40px 40px 0 0}
.hero-art .base{position:absolute;left:18px;bottom:14px;width:154px;height:8px;border-radius:6px;background:#ffd970}
h2.sec{font-size:22px;font-weight:800;margin:0 0 14px}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{flex:1;min-width:96px;background:none;border:none;padding:12px 8px;font-weight:800;font-size:14px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--faint);border-bottom:4px solid transparent;margin-bottom:-2px;cursor:pointer}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab:focus-visible,.btn:focus-visible,.task:focus-visible,.choice:focus-visible{outline:3px solid #84d8ff;outline-offset:2px}
.task-list{display:flex;flex-direction:column;gap:14px}
.task{display:flex;align-items:center;gap:20px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;
  padding:20px 22px;cursor:pointer;color:inherit}
.task:hover{background:var(--soft)}
.task-ico{flex:0 0 52px;height:52px;display:grid;place-items:center}
.task-body{flex:1;min-width:0}
.task-name{font-weight:800;font-size:18px}
.task-desc{color:var(--muted);font-size:14px;margin:2px 0 8px}
.task-meta{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:12px;border-radius:8px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:8px}
.task-count{font-size:14px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.skill-chip{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--blue);background:var(--blue-soft);border-radius:8px;padding:2px 8px}
.skill-chip.w{color:#ce82ff;background:#f6e8ff}

/* ---------- buttons ---------- */
.btn{border:none;border-radius:12px;padding:13px 26px;font-weight:800;font-size:15px;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;
  background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-dark);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-dark)}
.btn.green{background:var(--green);box-shadow:0 4px 0 var(--green-dark)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-dark)}
.btn.ghost{background:var(--card);color:var(--blue);border:2px solid var(--line);box-shadow:0 2px 0 var(--line)}
.btn:disabled{background:var(--line);color:var(--faint);box-shadow:none;cursor:default}

/* ---------- exam card ---------- */
.exam{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding-block:40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ecard{width:100%;max-width:960px;background:var(--card);border-radius:8px;display:flex;flex-direction:column;min-height:640px;position:relative;overflow:hidden}
.ehead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 40px;border-bottom:2px solid var(--line)}
.timer{display:flex;align-items:center;gap:8px;font-size:18px}
.timer b{font-size:24px;font-variant-numeric:tabular-nums}
.timer.low b{color:var(--red-dark)}
.ehead-r{display:flex;align-items:center;gap:16px}
.lvl{display:flex;gap:4px;align-items:flex-end}
.lvl i{width:8px;border-radius:3px;background:var(--line)}
.lvl i.on{background:var(--blue)}
.qcount{font-size:14px;color:var(--muted);font-weight:700}
.close{background:none;border:none;font-size:30px;line-height:1;color:var(--faint);cursor:pointer;padding:4px 8px}
.ebody{flex:1;padding:48px 40px;display:flex;flex-direction:column;align-items:center}
.ebody.split{padding:0;flex-direction:row;align-items:stretch}
.qtitle{font-size:28px;font-weight:800;margin:0 0 36px;text-align:center;text-wrap:balance}
.efoot{border-top:2px solid var(--line);padding:24px 40px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.efoot .hint{color:var(--muted);font-size:14px}

/* feedback panel */
.fb{position:absolute;left:0;right:0;bottom:0;padding:28px 40px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-radius:0 0 8px 8px}
.fb.ok{background:var(--green-soft);color:var(--green-dark)}
.fb.bad{background:var(--red-soft);color:var(--red-dark)}
.fb-t{font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px}
.fb-dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px}
.fb.ok .fb-dot{background:var(--green-dark)} .fb.bad .fb-dot{background:var(--red-dark)}
.fb-a{font-size:18px;margin-top:4px}
.fb-a strong{font-weight:800}

/* read and select */
.word{font-size:48px;margin:0 0 48px}
.yn{display:flex;gap:18px}
.choice{width:136px;height:132px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--card);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:20px;color:var(--ink)}
.choice svg{width:48px;height:48px}
.choice:hover{background:var(--soft)}
.choice.sel{border-color:#84d8ff;background:var(--blue-soft)}

/* letter boxes */
.sent{font-size:20px;line-height:2.4;max-width:820px;text-align:left}
.lb{display:inline-flex;vertical-align:middle;margin:0 4px}
.lb input,.lb span{width:24px;height:32px;border:2px solid var(--line);border-left-width:1px;border-right-width:1px;text-align:center;font:inherit;font-size:18px;
  color:var(--ink);background:var(--soft);padding:0;line-height:28px}
.lb span{background:var(--card)}
.lb>*:first-child{border-left-width:2px;border-radius:8px 0 0 8px}
.lb>*:last-child{border-right-width:2px;border-radius:0 8px 8px 0}
.lb input:focus{outline:none;border-color:var(--blue);background:var(--card);box-shadow:inset 0 0 0 1px var(--blue)}
.lb.ok input{background:var(--green-soft);border-color:#a5ed6e;color:var(--green-dark)}
.lb.bad input{background:var(--red-soft);border-color:#ffb2b2;color:var(--red-dark)}
.ctitle{font-weight:800;font-size:18px;text-align:center;margin-bottom:8px}
.ctext{font-size:18px;line-height:2.5}

/* interactive reading */
.pass{flex:1 1 50%;min-width:0;background:var(--soft);border-right:2px solid var(--line);padding:40px;overflow:auto;max-height:560px}
.pass-l{font-size:14px;font-weight:800;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.pass-t{font-size:18px;line-height:2.2}
.gap{display:inline-block;min-width:130px;border-bottom:2px solid var(--line);padding:0 6px;line-height:1.6;font-weight:700;color:var(--blue)}
.gap em{font-style:normal;display:inline-block;border:2px solid var(--line);border-radius:6px;font-size:12px;color:var(--muted);padding:0 6px;margin-right:6px;line-height:18px;font-weight:800}
.hl{background:#fff3b0;border-radius:4px}
.qs{flex:1 1 50%;min-width:0;padding:40px;overflow:auto;max-height:560px}
.qs h3{font-size:24px;font-weight:800;margin:0 0 20px;line-height:1.3;text-wrap:balance}
.sel-row{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:6px 12px;margin-bottom:12px;background:var(--card)}
.sel-row em{font-style:normal;border:2px solid var(--line);border-radius:6px;font-size:13px;font-weight:800;color:var(--muted);padding:0 7px}
.sel-row select{flex:1;border:none;background:transparent;font:inherit;font-size:17px;color:var(--ink);padding:8px 0;cursor:pointer}
.sel-row select:focus{outline:none}
.sel-row.ok{border-color:#a5ed6e;background:var(--green-soft)} .sel-row.bad{border-color:#ffb2b2;background:var(--red-soft)}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--card);
  font:inherit;font-size:17px;color:var(--ink);cursor:pointer}
.opt:hover{background:var(--soft)}
.opt.sel{border-color:#84d8ff;background:var(--blue-soft)}
.opt.ok{border-color:#a5ed6e;background:var(--green-soft)} .opt.bad{border-color:#ffb2b2;background:var(--red-soft)}

/* writing */
.wwrap{display:flex;gap:28px;width:100%;max-width:880px;align-items:stretch}
.wimg{flex:0 0 380px;max-width:100%;border-radius:12px;overflow:hidden;background:var(--soft)}
.wimg svg{display:block;width:100%;height:auto}
.wprompt{flex:0 0 340px;font-size:19px;line-height:1.6;background:var(--soft);border-radius:12px;padding:20px}
.wbox{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.wbox textarea{flex:1;min-height:260px;width:100%;resize:vertical;border:2px solid var(--line);border-radius:12px;background:var(--soft);padding:14px;font:inherit;font-size:17px;color:var(--ink)}
.wbox textarea:focus{outline:none;border-color:#84d8ff;background:var(--card)}
.wc{font-size:14px;color:var(--muted);font-weight:700;text-align:right}

/* results */
.res{max-width:880px;margin:0 auto;padding-block:36px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.res-card{background:var(--card);border-radius:16px;border:2px solid var(--line);padding:28px;margin-bottom:20px}
.res-top{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.score{width:150px;height:150px;border-radius:50%;border:10px solid var(--green);display:grid;place-items:center;text-align:center;flex:0 0 auto}
.score b{display:block;font-size:44px;line-height:1;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.score span{font-size:13px;color:var(--muted);font-weight:700}
.res-sum{flex:1;min-width:220px}
.res-sum h1{font-size:28px;margin:0 0 6px;font-weight:800}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat{border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px}
.stat b{font-size:20px;display:block;font-variant-numeric:tabular-nums}
.path{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:8px}
.path i{flex:1;max-width:34px;border-radius:6px 6px 0 0;position:relative}
.path i.ok{background:var(--green)} .path i.bad{background:var(--red)}
.res h2{font-size:20px;margin:0 0 14px;font-weight:800}
.rec{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.rec li{background:var(--blue-soft);border-radius:12px;padding:12px 16px}
.rec li b{color:var(--blue-dark)}
.rev{border-top:2px solid var(--line);padding:14px 0;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px}
.rev:first-of-type{border-top:none}
.rev-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px}
.rev-dot.ok{background:var(--green)} .rev-dot.bad{background:var(--red)} .rev-dot.w{background:#ce82ff}
.rev-q{font-weight:700}
.rev-a{font-size:15px;color:var(--muted);margin-top:2px}
.rev-a .you-bad{color:var(--red-dark);font-weight:700;text-decoration:line-through}
.rev-a .you-ok{color:var(--green-dark);font-weight:700}
.rev-a .right{color:var(--green-dark);font-weight:700}
.rev-tip{font-size:14px;background:var(--soft);border-radius:8px;padding:6px 10px;margin-top:6px}
.lvl-tag{font-size:12px;font-weight:800;color:var(--muted);border:2px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px}
.ai{white-space:pre-wrap;font-size:16px;line-height:1.6}
.ai-box{background:#f6e8ff;border-radius:12px;padding:16px;margin-top:10px}
.essay{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:14px;font-size:16px}
.res-actions{display:flex;gap:14px;flex-wrap:wrap}

@media (max-width:820px){
  .hub{grid-template-columns:1fr;gap:16px}
  .side{flex-direction:row;overflow-x:auto}
  .side-item{padding:8px 12px;font-size:12px;white-space:nowrap}
  .hero-art{display:none}
  .exam{padding-block:0;padding-left:0;padding-right:0}
  .ecard{border-radius:0;min-height:100vh}
  .ehead,.efoot{padding:16px}
  .ebody{padding:28px 16px}
  .ebody.split{flex-direction:column}
  .pass{border-right:none;border-bottom:2px solid var(--line);max-height:none;padding:20px 16px}
  .qs{max-height:none;padding:20px 16px 140px}
  .qtitle{font-size:22px;margin-bottom:24px}
  .word{font-size:40px}
  .sent,.ctext{font-size:17px}
  .wwrap{flex-direction:column}
  .wimg,.wprompt{flex:none}
  .fb{padding:18px 16px;flex-direction:column;align-items:stretch}
  .task{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>
<script data-app>
// Item banks, part 1. Every bank is indexed by level 1..5 (1 = easiest).
window.BANK = window.BANK || {};

// Read and Select: is this a real English word? r = real words, f = invented words.
BANK.select = {
  1: { r: ["water", "happy", "table", "river", "mother", "window", "friend", "yellow", "school", "listen"],
       f: ["brane", "fosh", "dinter", "clom", "pask", "sheb", "mibble", "trock", "wunder", "glain"] },
  2: { r: ["careful", "journey", "weather", "borrow", "empty", "village", "honest", "kitchen", "promise", "thirsty"],
       f: ["flendy", "warrow", "plimet", "crostle", "harnish", "bleaming", "sorrent", "trumble", "dorvish", "kettry"] },
  3: { r: ["consider", "frequent", "entire", "ancient", "behavior", "thorough", "rescue", "abundant", "convenient", "estimate"],
       f: ["frellant", "conspent", "deliance", "prastical", "ambirous", "tremulate", "unvirtant", "malticate", "obstrain", "pellucent"] },
  4: { r: ["reluctant", "scrutiny", "inevitable", "deteriorate", "meticulous", "ambiguous", "persevere", "plausible", "eloquent", "mitigate"],
       f: ["refluctant", "sarcolent", "obsiliate", "mendacure", "contrivial", "plenitate", "prevocative", "detrimony", "insolvate", "fervilous"] },
  5: { r: ["ubiquitous", "ephemeral", "obfuscate", "perfunctory", "recalcitrant", "sycophant", "lugubrious", "quixotic", "pernicious", "obsequious"],
       f: ["perfidulous", "obsequate", "recondify", "exiguant", "ephemious", "quindescent", "terpsical", "salubrent", "pervicuous", "lacrimonate"] }
};

// Russian glosses for real words, shown in the review.
BANK.gloss = {
  water: "вода", happy: "счастливый", table: "стол", river: "река", mother: "мама", window: "окно", friend: "друг", yellow: "жёлтый", school: "школа", listen: "слушать",
  careful: "осторожный", journey: "путешествие", weather: "погода", borrow: "брать взаймы", empty: "пустой", village: "деревня", honest: "честный", kitchen: "кухня", promise: "обещание", thirsty: "испытывающий жажду",
  consider: "рассматривать, считать", frequent: "частый", entire: "весь, целый", ancient: "древний", behavior: "поведение", thorough: "тщательный", rescue: "спасать", abundant: "обильный", convenient: "удобный", estimate: "оценивать",
  reluctant: "неохотный", scrutiny: "тщательная проверка", inevitable: "неизбежный", deteriorate: "ухудшаться", meticulous: "дотошный", ambiguous: "двусмысленный", persevere: "упорствовать", plausible: "правдоподобный", eloquent: "красноречивый", mitigate: "смягчать",
  ubiquitous: "вездесущий", ephemeral: "мимолётный", obfuscate: "запутывать", perfunctory: "поверхностный, формальный", recalcitrant: "непокорный", sycophant: "подхалим", lugubrious: "мрачный, скорбный", quixotic: "донкихотский, непрактичный", pernicious: "пагубный", obsequious: "раболепный"
};

// Fill in the Blanks: s = sentence with ___ for the gap, w = answer, p = given letters, t = hint in Russian.
BANK.blanks = {
  1: [
    { s: "I drink a ___ of milk every morning.", w: "glass", p: "gl", t: "glass — стакан" },
    { s: "My sister is ten ___ old.", w: "years", p: "ye", t: "ten years old — десять лет" },
    { s: "Please close the ___ when you leave.", w: "door", p: "do", t: "door — дверь" },
    { s: "It is very cold, so wear a ___ jacket.", w: "warm", p: "wa", t: "warm — тёплый" },
    { s: "We usually eat ___ at seven o'clock.", w: "dinner", p: "din", t: "dinner — ужин" },
    { s: "My brother can ___ very fast in the pool.", w: "swim", p: "sw", t: "swim — плавать" }
  ],
  2: [
    { s: "She was tired, so she went to bed ___.", w: "early", p: "ea", t: "early — рано" },
    { s: "Can you help me carry these ___ boxes?", w: "heavy", p: "he", t: "heavy — тяжёлый" },
    { s: "The museum is ___ on Mondays.", w: "closed", p: "clo", t: "closed — закрыт" },
    { s: "He ___ his umbrella and got wet in the rain.", w: "forgot", p: "for", t: "forget → forgot — забыл" },
    { s: "I need to ___ some money from my brother.", w: "borrow", p: "bor", t: "borrow from — занять у кого-то" },
    { s: "The train was ___, so we waited for an hour.", w: "late", p: "la", t: "late — опоздавший" }

  // Each student's data lives under its own prefix; the student list and sound setting are shared.
  const SHARED = new Set(["students", "current", "muted"]);

    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  // A student's file uses its own namespace so it never touches the teacher's data on the same computer.
  const NS = window.LOCK ? "detpL-" + window.LOCK.student.id + ":" : "detp:";

    get(k) { return raw.get(key(k)); },
    set(k, v) { raw.set(key(k), v); },
    // Backup of the current student's data: {key: value} without the namespace prefix.
    dump() {
      const pre = NS + (raw.get(NS + "current") || "default") + ":", out = {};

    load(obj) { Object.entries(obj || {}).forEach(([k, v]) => { if (!SHARED.has(k)) this.set(k, v); }); },

  let S = null, timerId = null;

  function startSection(id) {

    S = { sec, level: 3, i: 0, log: [], used: new Set(), seen: new Set(store.get("seen:" + id) || []), started: Date.now() };
    next();
  }

  // Correct answers move the level up, wrong answers move it down.
  function record(entry) {
    entry.level = S.level;
    S.log.push(entry);
    if (entry.ok === true) S.level = Math.min(5, S.level + 1);
    else if (entry.ok === false) S.level = Math.max(1, S.level - 1);
    else if (typeof entry.ok === "number") S.level = Math.max(1, Math.min(5, S.level + entry.ok));
  }

  function next() {
    stopTimer();
    if (S.i >= S.sec.n) { saveProgress(); return App.results(S); }
    const item = tasks[S.sec.id].make(S.level, S.used, S);
    S.i++;
    tasks[S.sec.id].render(item, S);
  }

  function saveProgress() {
    store.set("seen:" + S.sec.id, [...new Set([...S.seen, ...S.used])].slice(-3000));
    const p = store.get("progress") || {};
    const graded = S.log.filter(e => typeof e.ok === "boolean");
    const acc = graded.length ? graded.filter(e => e.ok).length / graded.length : null;
    const prev = p[S.sec.id] || { runs: 0, best: 0 };

    store.set("progress", p);

  // Rough DET-style estimate (10–160) from the levels reached and accuracy.
  function estimate(s) {
    const lv = s.log.map(e => e.level).concat([s.level]);
    const tail = lv.slice(Math.floor(lv.length / 2));
    const avg = tail.reduce((a, b) => a + b, 0) / tail.length;
    const graded = s.log.filter(e => typeof e.ok === "boolean");
    const acc = graded.length ? graded.filter(e => e.ok).length / graded.length : 0.6;

    go.onclick = onGo || next;
  }

  // ---- hub ----
  const ICONS = {
    select: `<svg viewBox="0 0 52 52" width="52" height="52"><rect x="4" y="6" width="26" height="26" rx="6" fill="#ddf4ff" stroke="#84d8ff" stroke-width="2"/><path d="M11 19l5 5 8-10" stroke="#1cb0f6" stroke-width="3.5" fill="none" stroke-linecap="round"/><rect x="24" y="24" width="22" height="22" rx="6" fill="#fff" stroke="#e5e5e5" stroke-width="2"/><path d="M30 30l10 10M40 30L30 40" stroke="#1cb0f6" stroke-width="3" stroke-linecap="round"/></svg>`,

          <h2 class="sec">Отработайте навыки</h2>
          <div class="tabs" role="tablist">
            ${[["all", "Все"], ["reading", "Reading"], ["writing", "Writing"]].map(([k, l]) => `<button class="tab ${tab === k ? "active" : ""}" data-tab="${k}" role="tab">${l}</button>`).join("")}

    $app.querySelectorAll(".task").forEach(b => b.onclick = () => App.startSection(b.dataset.id));

<script data-app>
// Reading tasks: Read and Select, Fill in the Blanks, Read and Complete, Interactive Reading.
(function () {
  const { tasks, esc, shuffle, pick, frame, record, next, startTimer, stopTimer } = App;
  const feedback = (...a) => App.feedback(...a);
  const $ = id => document.getElementById(id);
  const norm = s => String(s || "").trim().toLowerCase();

  // Pick an item never seen before from this level or a neighbour; otherwise one not used in this attempt.
  function fromLevel(bank, level, used, keyOf) {
    const seen = App.S.seen;
    const order = [0, -1, 1, -2, 2, -3, 3, -4, 4].map(d => level + d).filter(l => bank[l]);
    const tryPick = (levels, ok) => {
      for (const l of levels) {
        const free = bank[l].filter(ok);
        if (free.length) { const it = pick(free); used.add(keyOf(it)); return { it, lvl: l }; }
      }
    };
    const r = tryPick(order.filter(l => Math.abs(l - level) <= 1), x => !used.has(keyOf(x)) && !seen.has(keyOf(x)))
      || tryPick(order, x => !used.has(keyOf(x)));
    if (r) return r;
    const it = pick(bank[order[0]]); return { it, lvl: order[0] };
  }

  // Letter boxes: given letters as text, the rest as one-letter inputs.
  function boxes(word, given, idx) {
    let h = `<span class="lb" data-gap="${idx}">`;
    for (let i = 0; i < word.length; i++)
      h += i < given ? `<span>${esc(word[i])}</span>` : `<input maxlength="1" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="letter ${i + 1}">`;
    return h + "</span>";
  }
  function wireBoxes(root, onChange) {
    const inputs = [...root.querySelectorAll(".lb input")];
    inputs.forEach((inp, k) => {
      inp.addEventListener("input", () => { inp.value = inp.value.slice(-1); if (inp.value && inputs[k + 1]) inputs[k + 1].focus(); onChange(); });
      inp.addEventListener("keydown", e => {
        if (e.key === "Backspace" && !inp.value && inputs[k - 1]) { inputs[k - 1].focus(); inputs[k - 1].value = ""; onChange(); e.preventDefault(); }
        if (e.key === "Enter") { const b = $("submit"); if (b && !b.disabled) b.click(); }
      });
    });
    if (inputs[0]) inputs[0].focus();
  }
  const readGap = (lb, word, given) => word.slice(0, given) + [...lb.querySelectorAll("input")].map(i => i.value || "_").join("");
  const half = w => Math.max(1, Math.floor(w.length / 2));

  // ---------- Read and Select ----------
  tasks.select = {
    make(level, used) {
      const b = BANK.select[level], real = Math.random() < 0.5;
      const all = real ? b.r : b.f, seen = App.S.seen;
      const fresh = all.filter(w => !used.has(w) && !seen.has(w)), notNow = all.filter(w => !used.has(w));
      const w = pick(fresh.length ? fresh : notNow.length ? notNow : all); used.add(w);
      return { w, real };
    },
    render(it) {
      const yes = `<svg viewBox="0 0 48 48"><path d="M8 25l11 11L40 13" stroke="#1cb0f6" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      const no = `<svg viewBox="0 0 48 48"><path d="M11 11l26 26M37 11L11 37" stroke="#1cb0f6" stroke-width="7" stroke-linecap="round"/></svg>`;
      frame({ noFoot: true, body: `<h2 class="qtitle">Is this a real English word?</h2><div class="word">${esc(it.w)}</div>
        <div class="yn"><button class="choice" id="y">${yes}Yes</button><button class="choice" id="n">${no}No</button></div>` });
      let done = false;
      const answer = said => {
        if (done) return; done = true; stopTimer();
        const ok = said === it.real;
        if (said !== null) $(said ? "y" : "n").classList.add("sel");
        record({ type: "select", ok, q: it.w, you: said === null ? "нет ответа" : said ? "Yes" : "No", right: it.real ? "Yes" : "No",
          tip: it.real ? `Настоящее слово: ${it.w} — ${BANK.gloss[it.w] || ""}` : "Такого слова нет в английском.", real: it.real, timeout: said === null });
        feedback(ok, it.real ? "Yes" : "No");
      };
      $("y").onclick = () => answer(true); $("n").onclick = () => answer(false);
      startTimer(App.S.sec.time, () => answer(null));
    }
  };

  // ---------- Fill in the Blanks ----------
  tasks.blanks = {
    make(level, used) { return fromLevel(BANK.blanks, level, used, x => x.s).it; },
    render(it) {
      const given = it.p.length;
      const sent = esc(it.s).replace("___", boxes(it.w, given, 0));
      frame({ body: `<h2 class="qtitle">Complete the sentence with the correct word</h2><div class="sent">${sent}</div>`, hint: "Печатайте буквы — курсор переходит сам" });
      const body = $("ebody"), btn = $("submit");
      wireBoxes(body, () => { btn.disabled = ![...body.querySelectorAll("input")].some(i => i.value); });
      let done = false;
      const check = () => {
        if (done) return; done = true; stopTimer();
        const lb = body.querySelector(".lb"), you = readGap(lb, it.w, given), ok = norm(you) === norm(it.w);
        lb.classList.add(ok ? "ok" : "bad"); lb.querySelectorAll("input").forEach(i => i.disabled = true);
        btn.disabled = true;
        record({ type: "blanks", ok, q: it.s.replace("___", "____"), you, right: it.w, tip: it.t });
        feedback(ok, esc(it.w));
      };
      btn.onclick = check;
      startTimer(App.S.sec.time, check);
    }
  };

  // ---------- Read and Complete (C-test) ----------
  tasks.ctest = {
    make(level, used) { return fromLevel(BANK.ctest, level, used, x => x.title).it; },
    render(it) {
      const gaps = [];
      const html = esc(it.text).replace(/\[([^\]]+)\]/g, (_, w) => { gaps.push(w); return boxes(w, half(w), gaps.length - 1); });
      frame({ timerLabel: "for this question", body: `<h2 class="qtitle">Complete the text with the correct words</h2>
        <div style="max-width:860px"><div class="ctitle">${esc(it.title)}</div><div class="ctext">${html}</div></div>`, hint: `${gaps.length} пропусков`, enabled: true });
      const body = $("ebody");
      wireBoxes(body, () => {});
      let done = false;
      const check = () => {
        if (done) return; done = true; stopTimer();
        const items = [...body.querySelectorAll(".lb")].map((lb, k) => {
          const w = gaps[k], you = readGap(lb, w, half(w)), ok = norm(you) === norm(w);
          lb.classList.add(ok ? "ok" : "bad"); lb.querySelectorAll("input").forEach(i => i.disabled = true);
          return { w, you, ok };
        });
        $("submit").disabled = true;
        const right = items.filter(x => x.ok).length, acc = right / items.length;
        record({ type: "ctest", ok: acc >= 0.75 ? 1 : acc < 0.45 ? -1 : 0, acc, q: it.title, items, right, total: items.length });
        const wrong = items.filter(x => !x.ok).map(x => `${esc(x.w)}`).join(", ");
        feedback(acc >= 0.75, `${right} из ${items.length} верно. Пропущенные слова: ${wrong}`);
      };
      $("submit").onclick = check;
      startTimer(App.S.sec.time, check);
    }
  };

  // ---------- Interactive Reading ----------
  tasks.ireading = {
    make(level, used) { return fromLevel(BANK.ireading, level, used, x => x.title).it; },
    render(it) {
      const sel = Array(it.g.length).fill("");
      const opts = it.g.map(g => shuffle(g));
      const qs = it.q.map(q => { const order = shuffle(q.o.map((t, k) => k)); return { ...q, order }; });
      const qAns = Array(qs.length).fill(null);
      let stage = 1, gapRes = null;

      const passage = () => esc(it.text).replace(/\{(\d)\}/g, (_, n) => {
        const k = n - 1, v = sel[k];
        const cls = gapRes ? (gapRes[k] ? "color:var(--green-dark)" : "color:var(--red-dark)") : "";
        return `<span class="gap" style="${cls}"><em>${n}</em>${esc(v || "")}</span>`;
      });
      const left = () => `<div class="pass"><div class="pass-l">Passage · ${esc(it.title)}</div><div class="pass-t" id="pt">${passage()}</div></div>`;

      function stage1() {
        frame({ split: true, timerLabel: "for this passage", body: left() + `<div class="qs"><h3>Select the best option for each missing word</h3>
          ${opts.map((o, k) => `<label class="sel-row" id="row${k}"><em>${k + 1}</em><select id="s${k}" aria-label="gap ${k + 1}"><option value="">Select a word</option>${o.map(w => `<option>${esc(w)}</option>`).join("")}</select></label>`).join("")}</div>` });
        opts.forEach((o, k) => $("s" + k).onchange = e => { sel[k] = e.target.value; $("pt").innerHTML = passage(); $("submit").disabled = sel.some(v => !v); });
        $("submit").onclick = checkGaps;
        startTimer(App.S.sec.time, () => { if (stage === 1) checkGaps(); else checkQs(); });
      }
      function checkGaps() {
        gapRes = sel.map((v, k) => v === it.g[k][0]);
        gapRes.forEach((ok, k) => { $("row" + k).classList.add(ok ? "ok" : "bad"); $("s" + k).disabled = true; });
        $("pt").innerHTML = passage(); $("submit").disabled = true;
        const n = gapRes.filter(Boolean).length;
        feedback(n === gapRes.length, `${n} из ${gapRes.length}: ${it.g.map((g, k) => gapRes[k] ? null : `${k + 1} — ${esc(g[0])}`).filter(Boolean).join(", ")}`, stage2);
      }
      function stage2() {
        stage = 2;
        $("fb").innerHTML = "";
        const qsEl = document.querySelector(".qs");
        qsEl.innerHTML = qs.map((q, qi) => `<h3 style="font-size:20px;margin-top:${qi ? 28 : 0}px">${esc(q.q)}</h3>
          ${q.order.map(oi => `<button class="opt" data-q="${qi}" data-o="${oi}">${esc(q.o[oi])}</button>`).join("")}`).join("");
        qsEl.scrollTop = 0;
        qsEl.querySelectorAll(".opt").forEach(b => b.onclick = () => {
          if (stage !== 2) return;
          const qi = +b.dataset.q; qAns[qi] = +b.dataset.o;
          qsEl.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(x => x.classList.toggle("sel", x === b));
          $("submit").disabled = qAns.some(v => v === null);
        });
        $("submit").onclick = checkQs;
      }
      function checkQs() {
        if (stage === 3) return; stage = 3; stopTimer();
        const qRes = qs.map((q, qi) => qAns[qi] === q.a);
        document.querySelectorAll(".opt").forEach(b => {
          const q = qs[+b.dataset.q], o = +b.dataset.o;
          if (o === q.a) b.classList.add("ok"); else if (qAns[+b.dataset.q] === o) b.classList.add("bad");
        });
        $("submit").disabled = true;
        const all = gapRes.concat(qRes), acc = all.filter(Boolean).length / all.length;
        record({ type: "ireading", ok: acc >= 0.75 ? 1 : acc < 0.5 ? -1 : 0, acc, q: it.title,
          gaps: it.g.map((g, k) => ({ w: g[0], you: sel[k] || "—", ok: gapRes[k] })),
          qs: qs.map((q, qi) => ({ q: q.q, type: q.type, you: qAns[qi] === null ? "—" : q.o[qAns[qi]], right: q.o[q.a], ok: qRes[qi] })),
          right: all.filter(Boolean).length, total: all.length });
        feedback(qRes.every(Boolean), qs.map((q, qi) => qRes[qi] ? null : esc(q.o[q.a])).filter(Boolean).join("<br>"));
      }
      stage1();
    }
  };
})();

<script data-app>
// Interactive Reading in DET order: Complete the Sentences → Complete the Passage →
// Highlight the Answer ×2 → Identify the Idea → Title the Passage.
(function () {
  const { esc, shuffle, pick, frame, record, startTimer, stopTimer } = App;
  const $ = id => document.getElementById(id);
  const words = s => String(s).toLowerCase().match(/[a-z0-9']+/g) || [];

  const css = document.createElement("style");
  css.dataset.inj = "1";
  css.textContent = `
  .slot{display:inline-block;min-width:60%;border:2px dashed #84d8ff;border-radius:10px;background:var(--blue-soft);color:var(--blue-dark);padding:2px 10px;font-weight:700;line-height:1.6}
  .slot.ok{border-style:solid;border-color:#a5ed6e;background:var(--green-soft);color:var(--green-dark)}
  .slot.bad{border-style:solid;border-color:#ffb2b2;background:var(--red-soft);color:var(--red-dark)}
  .pass-t.hlmode{cursor:text;user-select:text;-webkit-user-select:text}
  .pass-t.hlmode::selection,.pass-t.hlmode *::selection{background:#ffe58f;color:var(--ink)}
  .pass-t mark{border-radius:4px;padding:1px 2px}
  .pass-t mark.ok{background:#b8f28a}
  .pass-t mark.you{background:#fff3b0}
  .pick{border:2px dashed var(--line);border-radius:12px;padding:12px;min-height:56px;color:var(--muted);margin:10px 0}
  .pick.has{border-style:solid;border-color:#ffe58f;background:#fffbe6;color:var(--ink)}`;
  document.head.appendChild(css);

  // Selected text counts as correct when it covers most of the key phrase and is not much longer.
  function hlOk(sel, key) {
    const kw = words(key), sw = words(sel);
    if (!kw.length || !sw.length) return false;
    const hit = kw.filter(w => sw.includes(w)).length / kw.length;
    return hit >= 0.6 && sw.length <= kw.length * 3 + 4;
  }

  App.tasks.ireading = {
    make(level, used) {
      const seen = App.S.seen, B = BANK.ireading;
      const order = [0, -1, 1, -2, 2, -3, 3, -4, 4].map(d => level + d).filter(l => B[l] && B[l].length);
      for (const pass of [x => !used.has(x.title) && !seen.has(x.title), x => !used.has(x.title), () => true])
        for (const l of order) { const f = B[l].filter(pass); if (f.length) { const it = pick(f); used.add(it.title); return it; } }
    },
    render(it) {
      const x = BANK.irx[it.title];
      const sel = Array(it.g.length).fill(""), opts = it.g.map(g => shuffle(g));
      const plain = it.text.replace(/\{(\d)\}/g, (_, n) => it.g[n - 1][0]);
      const full = x && plain.includes(x.ms.before) ? plain.replace(x.ms.before, x.ms.o[0] + " " + x.ms.before) : plain;
      const qs = it.q.filter(q => q.type !== "detail").map(q => ({ ...q, order: shuffle(q.o.map((_, k) => k)) }));
      const qAns = qs.map(() => null);
      const res = { gaps: [], qs: [] };
      let gapRes = null, step = "gaps", msPick = null, msOrder = x ? shuffle(x.ms.o.map((_, k) => k)) : [], hlI = 0, hlSel = "";

      const gapText = () => esc(it.text).replace(/\{(\d)\}/g, (_, n) => {
        const k = n - 1, st = gapRes ? (gapRes[k] ? "color:var(--green-dark)" : "color:var(--red-dark)") : "";
        return `<span class="gap" style="${st}"><em>${n}</em>${esc(sel[k] || "")}</span>`;
      });
      const marked = (text, phrase, cls) => {
        const i = phrase ? text.indexOf(phrase) : -1;
        return i < 0 ? esc(text) : esc(text.slice(0, i)) + `<mark class="${cls}">${esc(phrase)}</mark>` + esc(text.slice(i + phrase.length));
      };
      const setPassage = html => { $("pt").innerHTML = html; };
      const right = html => { const q = document.querySelector(".qs"); q.innerHTML = html; q.scrollTop = 0; };
      const go = fn => () => { $("fb").innerHTML = ""; fn(); };

      frame({ split: true, timerLabel: "for this passage", body: `<div class="pass"><div class="pass-l">Passage · ${esc(it.title)}</div><div class="pass-t" id="pt">${gapText()}</div></div><div class="qs"></div>` });
      startTimer(App.S.sec.time, finishAll);

      // 1. Complete the Sentences
      right(`<h3>Select the best option for each missing word</h3>${opts.map((o, k) => `<label class="sel-row" id="row${k}"><em>${k + 1}</em><select id="s${k}" aria-label="gap ${k + 1}"><option value="">Select a word</option>${o.map(w => `<option>${esc(w)}</option>`).join("")}</select></label>`).join("")}`);
      opts.forEach((o, k) => $("s" + k).onchange = e => { sel[k] = e.target.value; setPassage(gapText()); $("submit").disabled = sel.some(v => !v); });
      $("submit").onclick = checkGaps;

      function checkGaps() {
        if (step !== "gaps") return;
        gapRes = sel.map((v, k) => v === it.g[k][0]);
        gapRes.forEach((ok, k) => { $("row" + k).classList.add(ok ? "ok" : "bad"); $("s" + k).disabled = true; });
        res.gaps = it.g.map((g, k) => ({ w: g[0], you: sel[k] || "—", ok: gapRes[k] }));
        setPassage(gapText()); $("submit").disabled = true; step = "gaps-done";
        const n = gapRes.filter(Boolean).length;
        App.feedback(n === gapRes.length, `${n} из ${gapRes.length}: ${it.g.map((g, k) => gapRes[k] ? null : `${k + 1} — ${esc(g[0])}`).filter(Boolean).join(", ")}`, go(x ? passageStep : ideaStep));
      }

      // 2. Complete the Passage
      function passageStep() {
        step = "ms";
        const i = plain.indexOf(x.ms.before);
        setPassage(esc(plain.slice(0, i)) + `<span class="slot" id="slot">Select the best sentence</span> ` + esc(plain.slice(i)));
        right(`<h3>Select the best sentence to fill in the blank in the passage</h3>${msOrder.map(k => `<button class="opt" data-m="${k}">${esc(x.ms.o[k])}</button>`).join("")}`);
        document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => {
          if (step !== "ms") return;
          msPick = +b.dataset.m;
          document.querySelectorAll("[data-m]").forEach(o => o.classList.toggle("sel", o === b));
          $("slot").textContent = x.ms.o[msPick]; $("submit").disabled = false;
        });
        $("submit").disabled = true; $("submit").onclick = checkMs;
      }
      function checkMs() {
        if (step !== "ms") return; step = "ms-done";
        const ok = msPick === 0;
        document.querySelectorAll("[data-m]").forEach(o => { const k = +o.dataset.m; if (k === 0) o.classList.add("ok"); else if (k === msPick) o.classList.add("bad"); });
        $("slot").classList.add(ok ? "ok" : "bad"); $("submit").disabled = true;
        res.qs.push({ q: "Complete the passage", type: "passage", you: msPick === null ? "—" : x.ms.o[msPick], right: x.ms.o[0], ok });
        App.feedback(ok, esc(x.ms.o[0]), go(hlStep));
      }

      // 3–4. Highlight the Answer
      function hlStep() {
        step = "hl"; hlSel = "";
        const h = x.hl[hlI];
        setPassage(esc(full)); $("pt").classList.add("hlmode");
        right(`<div class="pass-l">Question ${hlI + 1} of ${x.hl.length}</div><h3>Click and drag text to highlight the answer to the question below</h3>
          <div style="font-size:19px;font-weight:700;margin-bottom:6px">${esc(h.q)}</div>
          <div class="pick" id="pick">Выделите ответ мышкой (или пальцем) в тексте слева</div>`);
        $("submit").disabled = true; $("submit").onclick = checkHl;
      }
      document.addEventListener("selectionchange", onSel);
      function onSel() {
        if (step !== "hl" || !$("pt")) return;
        const s = window.getSelection();
        if (!s || !s.rangeCount || !$("pt").contains(s.anchorNode)) return;
        const t = s.toString().trim();
        if (!t) return;
        hlSel = t;
        const p = $("pick"); p.textContent = "«" + t + "»"; p.classList.add("has");
        $("submit").disabled = false;
      }
      function checkHl() {
        if (step !== "hl") return; step = "hl-done";
        const h = x.hl[hlI], ok = hlOk(hlSel, h.a);
        window.getSelection().removeAllRanges(); $("pt").classList.remove("hlmode");
        setPassage(marked(full, h.a, "ok")); $("submit").disabled = true;
        res.qs.push({ q: h.q, type: "highlight", you: hlSel || "—", right: h.a, ok });
        App.feedback(ok, esc(h.a), go(() => { hlI++; if (hlI < x.hl.length) hlStep(); else ideaStep(); }));
      }

      // 5–6. Identify the Idea, Title the Passage
      function ideaStep() {
        step = "qs"; setPassage(esc(full));
        right(qs.map((q, qi) => `<h3 style="font-size:20px;margin-top:${qi ? 28 : 0}px">${esc(q.q)}</h3>${q.order.map(oi => `<button class="opt" data-q="${qi}" data-o="${oi}">${esc(q.o[oi])}</button>`).join("")}`).join(""));
        document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
          if (step !== "qs") return;
          const qi = +b.dataset.q; qAns[qi] = +b.dataset.o;
          document.querySelectorAll(`[data-q="${qi}"]`).forEach(o => o.classList.toggle("sel", o === b));
          $("submit").disabled = qAns.some(v => v === null);
        });
        $("submit").disabled = true; $("submit").onclick = checkQs;
      }
      function checkQs() {
        if (step !== "qs") return; step = "done"; stopTimer();
        document.querySelectorAll("[data-q]").forEach(b => { const q = qs[+b.dataset.q], o = +b.dataset.o; if (o === q.a) b.classList.add("ok"); else if (qAns[+b.dataset.q] === o) b.classList.add("bad"); });
        qs.forEach((q, qi) => res.qs.push({ q: q.q, type: q.type, you: qAns[qi] === null ? "—" : q.o[qAns[qi]], right: q.o[q.a], ok: qAns[qi] === q.a }));
        $("submit").disabled = true;
        const okAll = qs.every((q, qi) => qAns[qi] === q.a);
        App.feedback(okAll, qs.map((q, qi) => qAns[qi] === q.a ? null : esc(q.o[q.a])).filter(Boolean).join("<br>"), go(save));
      }

      // Time ran out: whatever is unanswered counts as wrong.
      function finishAll() {
        if (!gapRes) { gapRes = sel.map((v, k) => v === it.g[k][0]); res.gaps = it.g.map((g, k) => ({ w: g[0], you: sel[k] || "—", ok: gapRes[k] })); }
        const have = new Set(res.qs.map(q => q.type + q.q));
        if (x && !have.has("passageComplete the passage")) res.qs.push({ q: "Complete the passage", type: "passage", you: "—", right: x.ms.o[0], ok: false });
        if (x) x.hl.forEach(h => { if (!have.has("highlight" + h.q)) res.qs.push({ q: h.q, type: "highlight", you: "—", right: h.a, ok: false }); });
        qs.forEach(q => { if (!have.has(q.type + q.q)) res.qs.push({ q: q.q, type: q.type, you: "—", right: q.o[q.a], ok: false }); });
        save();
      }
      function save() {
        if (step === "saved") return; step = "saved"; stopTimer();
        document.removeEventListener("selectionchange", onSel);
        const all = res.gaps.map(g => g.ok).concat(res.qs.map(q => q.ok)), right = all.filter(Boolean).length, acc = right / all.length;
        record({ type: "ireading", ok: acc >= 0.75 ? 1 : acc < 0.5 ? -1 : 0, acc, q: it.title, gaps: res.gaps, qs: res.qs, right, total: all.length });
        App.next();
      }
    }
  };
})();

</script>

    { l: 5, id: "lab", hint: "scientists working in a laboratory with a robot arm and computer screens",
      svg: `<svg viewBox="0 0 380 260"><rect width="380" height="260" fill="#eef3f8"/><rect y="170" width="380" height="90" fill="#cfd8e2"/><rect x="0" y="150" width="380" height="22" fill="#9aa5b1"/><rect x="20" y="50" width="110" height="70" rx="6" fill="#4b4b4b"/><path d="M30 100l20-20 15 12 20-26 20 18" stroke="#58cc02" stroke-width="4" fill="none"/><rect x="150" y="40" width="70" height="60" rx="6" fill="#4b4b4b"/><g fill="#1cb0f6"><rect x="160" y="52" width="50" height="6"/><rect x="160" y="64" width="34" height="6"/><rect x="160" y="76" width="44" height="6"/></g><path d="M300 150v-50l-40-30" stroke="#ff8c42" stroke-width="12" stroke-linecap="round" fill="none"/><circle cx="300" cy="100" r="9" fill="#4b4b4b"/><path d="M252 64l-10-8m10 8l-6 12" stroke="#4b4b4b" stroke-width="4"/><circle cx="90" cy="128" r="11" fill="#f2c9a0"/><rect x="78" y="139" width="24" height="30" rx="7" fill="#fff" stroke="#cfd8e2" stroke-width="2"/><circle cx="200" cy="126" r="11" fill="#8d5a3b"/><rect x="188" y="137" width="24" height="32" rx="7" fill="#fff" stroke="#cfd8e2" stroke-width="2"/><rect x="230" y="134" width="10" height="18" rx="3" fill="#ce82ff"/></svg>` }
  ];

  const LINKERS = ["however", "therefore", "because", "although", "while", "moreover", "furthermore", "for example", "for instance", "in addition", "on the other hand", "as a result", "in conclusion", "firstly", "secondly", "finally", "also", "but", "so", "since", "whereas", "overall", "in my opinion", "instead", "unless"];
  const STOP = new Set("the a an and or but so to of in on at for with is are was were be it this that i you he she we they my your his her our their there have has had do does did not as by from".split(" "));

  // Rule-based metrics so feedback works even without the AI check.
  function metrics(text) {
    const t = text.trim();
    const words = t ? t.split(/\s+/).filter(w => /[a-z]/i.test(w)) : [];
    const sents = t ? t.split(/[.!?]+(\s|$)/).filter(s => s && s.trim().length > 1) : [];
    const lower = t.toLowerCase();
    const links = LINKERS.filter(l => new RegExp("\\b" + l + "\\b").test(lower));
    const counts = {};
    words.map(w => w.toLowerCase().replace(/[^a-z']/g, "")).filter(w => w && !STOP.has(w)).forEach(w => counts[w] = (counts[w] || 0) + 1);
    const repeats = Object.entries(counts).filter(([w, n]) => n >= 3 && w.length > 2).sort((a, b) => b[1] - a[1]).slice(0, 4);
    const uniq = new Set(words.map(w => w.toLowerCase().replace(/[^a-z']/g, ""))).size;
    const long = words.filter(w => w.replace(/[^a-z]/gi, "").length >= 8).length;
    const issues = [];
    if (/\bi\b/.test(t)) issues.push("Местоимение «I» всегда пишется с большой буквы.");
    if (sents.some(s => /^[a-z]/.test(s.trim()))) issues.push("Начинайте каждое предложение с большой буквы.");
    if (t && !/[.!?]$/.test(t)) issues.push("Последнее предложение не закончено точкой.");
    return { words: words.length, sents: sents.length, avg: sents.length ? words.length / sents.length : 0, links, repeats, ttr: words.length ? uniq / words.length : 0, long, issues };
  }

  // Score a response 0..1 against the target length for this task.
  function quality(m, target) {
    let q = Math.min(1, m.words / target) * 0.5;
    q += Math.min(1, m.links.length / 3) * 0.2;
    q += Math.min(1, m.ttr / 0.6) * 0.15;
    q += Math.min(1, m.long / Math.max(3, target / 15)) * 0.15;
    return q - Math.min(0.2, m.issues.length * 0.05);
  }

  function writeScreen({ title, side, target, seconds, label, onDone }) {
    frame({ timerLabel: label, enabled: false, submitLabel: "Submit",
      body: `<h2 class="qtitle">${esc(title)}</h2><div class="wwrap">${side}
        <div class="wbox"><textarea id="ta" placeholder="Your response" spellcheck="false" aria-label="Your response"></textarea>
        <div class="wc"><span id="wc">0</span> words · цель ${target}+</div></div></div>`,
      hint: "Проверка орфографии отключена, как на экзамене" });
    const ta = $("ta"), btn = $("submit");
    ta.focus();
    ta.oninput = () => { const n = metrics(ta.value).words; $("wc").textContent = n; btn.disabled = n < 1; };
    let done = false;
    const finish = () => { if (done) return; done = true; stopTimer(); ta.disabled = true; btn.disabled = true; onDone(ta.value); };
    btn.onclick = finish;
    startTimer(seconds, finish);
  }

  function step(q) { return q >= 0.7 ? 1 : q < 0.4 ? -1 : 0; }

  // A prompt near the level, preferring ones never seen in earlier attempts.
  function pickPrompt(level, used) {
    const seen = App.S.seen, L = BANK.writingList;
    const order = [0, -1, 1, -2, 2, -3, 3, -4, 4].map(d => level + d).filter(l => L[l]);
    for (const pass of [x => !used.has(x.q) && !seen.has(x.q), x => !used.has(x.q), () => true])
      for (const l of order) {
        const free = L[l].filter(pass);
        if (free.length) { const it = pick(free); used.add(it.q); return { l, it }; }
      }
  }

  // ---------- Write About the Photo ----------
  tasks.photo = {
    make(level, used) {
      const seen = App.S.seen, fresh = SCENES.filter(s => !used.has(s.id) && !seen.has(s.id) && Math.abs(s.l - level) <= 1);
      const free = fresh.length ? fresh : SCENES.filter(s => !used.has(s.id));
      const sc = free.sort((a, b) => Math.abs(a.l - level) - Math.abs(b.l - level))[0] || pick(SCENES);
      used.add(sc.id); return sc;
    },
    render(sc) {
      const target = 25 + App.S.level * 5;
      writeScreen({ title: "Write a description of the image below for 1 minute", side: `<div class="wimg">${sc.svg}</div>`, target, seconds: App.S.sec.time, label: "for this question",
        onDone(text) {
          const m = metrics(text), q = quality(m, target);
          record({ type: "photo", ok: step(q), q: "Опишите картинку: " + sc.hint, prompt: "Describe the image: " + sc.hint, text, m, quality: q, target, svg: sc.svg });
          feedback(q >= 0.55, `${m.words} слов при цели ${target}+. Подробный разбор — в конце раздела.`);
        } });
    }
  };

  // ---------- Writing Sample ----------
  tasks.wsample = {
    make(level, used) { const r = pickPrompt(level, used); return { l: r.l, p: r.it.q }; },
    render(it) {
      const target = 50 + it.l * 15;
      writeScreen({ title: "Write about the topic below for 5 minutes", side: `<div class="wprompt">${esc(it.p)}</div>`, target, seconds: App.S.sec.time, label: "for this question",
        onDone(text) {
          const m = metrics(text), q = quality(m, target);
          record({ type: "wsample", ok: step(q), q: it.p, prompt: it.p, text, m, quality: q, target });
          feedback(q >= 0.55, `${m.words} слов при цели ${target}+. Подробный разбор — в конце раздела.`);
        } });
    }
  };

  // ---------- Interactive Writing: main answer, then a follow-up on the same topic ----------
  tasks.iwriting = {
    make(level, used) {
      if (App.S.i === 0) { const r = pickPrompt(level, used); App.S.topic = r; return { l: r.l, p: r.it.q, part: 1 }; }
      const r = App.S.topic; return { l: r.l, p: r.it.f, part: 2 };
    },
    render(it) {
      const target = it.part === 1 ? 50 + it.l * 15 : 30 + it.l * 10;
      const secs = it.part === 1 ? 300 : 180;
      const side = it.part === 1 ? `<div class="wprompt">${esc(it.p)}</div>`
        : `<div class="wprompt"><div style="color:var(--muted);font-size:14px;margin-bottom:8px">Your first answer was saved. Now respond to this:</div>${esc(it.p)}</div>`;
      writeScreen({ title: it.part === 1 ? "Respond to the question in at least 50 words" : "Follow-up: respond in 3 minutes", side, target, seconds: secs, label: it.part === 1 ? "for part 1" : "for part 2",
        onDone(text) {
          const m = metrics(text), q = quality(m, target);
          record({ type: "iwriting", ok: 0, q: it.p, prompt: it.p, text, m, quality: q, target, part: it.part });
          feedback(q >= 0.55, `${m.words} слов при цели ${target}+.`);
        } });
    }
  };

  App.metrics = metrics;
  App.SCENES = SCENES;
})();

</script>

<script data-app>
// Results: score estimate, answers review, recommendations, optional AI feedback on writing.
(function () {
  const { esc, estimate, stopTimer } = App;
  const $ = id => document.getElementById(id);
  const LV = ["", "A1–A2", "A2–B1", "B1", "B2", "C1"];

  function lev(a, b) { // edit distance, for "spelling vs wrong word"
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }
  const low = s => String(s).toLowerCase().replace(/_/g, "");

  function recommendations(S) {
    const L = S.log, r = [], id = S.sec.id, top = Math.max(...L.map(e => e.level), S.level);
    if (id === "select") {
      const missedReal = L.filter(e => !e.ok && e.real && !e.timeout), fake = L.filter(e => !e.ok && !e.real && !e.timeout), to = L.filter(e => e.timeout);
      if (missedReal.length) r.push(`<b>Словарный запас.</b> Вы не узнали настоящие слова: ${missedReal.map(e => esc(e.q)).join(", ")}. Выпишите их с переводом и повторите через день.`);
      if (fake.length) r.push(`<b>Ложные слова.</b> Вы приняли за настоящие: ${fake.map(e => esc(e.q)).join(", ")}. Отвечайте «Yes», только если уверены, что встречали слово, — неверное «Yes» на экзамене снижает балл.`);
      if (to.length) r.push(`<b>Скорость.</b> ${to.length} раз(а) не успели ответить. На каждое слово около 5 секунд: решайте с первого взгляда.`);
    }
    if (id === "blanks") {
      const wrong = L.filter(e => !e.ok);
      const spell = wrong.filter(e => lev(low(e.you), low(e.right)) <= 2 && low(e.you).length >= low(e.right).length - 1);
      const vocab = wrong.filter(e => !spell.includes(e));
      if (spell.length) r.push(`<b>Орфография.</b> Слово было угадано, но с ошибкой: ${spell.map(e => `${esc(e.you)} → <b>${esc(e.right)}</b>`).join(", ")}. Тренируйте написание по карточкам.`);
      if (vocab.length) r.push(`<b>Контекст.</b> Читайте всё предложение до конца: подсказка часто стоит после пропуска (предлог, артикль, форма глагола). Повторите: ${vocab.map(e => esc(e.right)).join(", ")}.`);
    }
    if (id === "ctest") {
      const miss = L.flatMap(e => e.items.filter(x => !x.ok));
      const ending = miss.filter(x => x.you.replace(/_/g, "") && lev(low(x.you), low(x.w)) <= 2);
      if (ending.length) r.push(`<b>Окончания и грамматика.</b> Почти правильно: ${ending.map(x => `${esc(x.you)} → <b>${esc(x.w)}</b>`).join(", ")}. Проверяйте время глагола, -s у he/she/it и множественное число.`);
      if (miss.length - ending.length > 0) r.push(`<b>Смысл текста.</b> Сначала прочитайте весь текст бегло, потом заполняйте пропуски. Короткие служебные слова (the, of, will, this) дают лёгкие баллы — не пропускайте их.`);
    }
    if (id === "ireading") {
      const gapMiss = L.flatMap(e => e.gaps.filter(g => !g.ok)), qMiss = L.flatMap(e => e.qs.filter(q => !q.ok));
      if (gapMiss.length) r.push(`<b>Сочетаемость слов.</b> Ошибки в пропусках: ${gapMiss.map(g => `${esc(g.you)} → <b>${esc(g.w)}</b>`).join(", ")}. Проверяйте, подходит ли слово по смыслу и грамматически (часть речи, предлог после него).`);
      if (qMiss.some(q => q.type === "idea" || q.type === "title")) r.push(`<b>Главная мысль.</b> Правильный ответ охватывает весь текст, а не одну деталь. Перечитайте первое и последнее предложения.`);
      if (qMiss.some(q => q.type === "passage")) r.push(`<b>Недостающее предложение.</b> Читайте предложения до и после пропуска: правильный вариант продолжает ту же мысль и связан с ними по смыслу (местоимения, связки, тема).`);
      if (qMiss.some(q => q.type === "highlight")) r.push(`<b>Поиск ответа.</b> Найдите в тексте ключевое слово из вопроса и выделите только ту часть предложения, которая прямо отвечает на вопрос, — не всё предложение целиком.`);
      if (qMiss.some(q => q.type === "detail")) r.push(`<b>Детали.</b> Найдите в тексте ключевое слово из вопроса и прочитайте предложение вокруг него.`);
    }
    if (["photo", "wsample", "iwriting"].includes(id)) {
      const ms = L.map(e => e.m);
      const short = L.filter(e => e.m.words < e.target);
      if (short.length) r.push(`<b>Объём.</b> ${short.length} из ${L.length} ответов короче цели. На экзамене длина и полнота ответа заметно влияют на балл — пишите до конца таймера.`);
      const links = [...new Set(ms.flatMap(m => m.links))];
      if (links.length < 3) r.push(`<b>Связность.</b> Используйте больше связок: however, for example, as a result, on the other hand, in addition. Сейчас: ${links.length ? links.join(", ") : "почти нет"}.`);
      const reps = ms.flatMap(m => m.repeats.map(([w]) => w));
      if (reps.length) r.push(`<b>Разнообразие лексики.</b> Часто повторяются: ${[...new Set(reps)].slice(0, 5).join(", ")}. Подберите синонимы.`);
      if (ms.some(m => m.avg && m.avg < 9)) r.push(`<b>Сложные предложения.</b> Предложения в среднем короткие. Соединяйте их через which, because, although, when.`);
      const iss = [...new Set(ms.flatMap(m => m.issues))];
      iss.forEach(t => r.push(`<b>Оформление.</b> ${esc(t)}`));
    }
    if (!r.length) r.push(`<b>Отлично!</b> Ошибок почти нет. Попробуйте пройти раздел ещё раз: начнёте сразу с высокого уровня.`);
    if (top <= 2) r.push(`<b>Уровень.</b> Задания пока держатся на простых уровнях. Начните с лексики A2–B1 и читайте короткие адаптированные тексты.`);
    return r;
  }

  function review(e, i) {
    const n = i + 1, tag = `<span class="lvl-tag">ур. ${e.level}</span>`;
    if (e.type === "select" || e.type === "blanks" || e.type === "review") {
      const you = e.ok ? `<span class="you-ok">${esc(e.you)}</span>` : `<span class="you-bad">${esc(e.you)}</span> → <span class="right">${esc(e.right)}</span>`;
      return `<div class="rev"><span class="rev-dot ${e.ok ? "ok" : "bad"}">${n}</span><div><div class="rev-q">${esc(e.q)} ${tag}</div><div class="rev-a">Ваш ответ: ${you}</div>${e.tip ? `<div class="rev-tip">${esc(e.tip)}</div>` : ""}</div></div>`;
    }
    if (e.type === "ctest") {
      const list = e.items.map(x => x.ok ? `<span class="you-ok">${esc(x.w)}</span>` : `<span class="you-bad">${esc(x.you)}</span> <span class="right">${esc(x.w)}</span>`).join(" · ");
      return `<div class="rev"><span class="rev-dot ${e.acc >= .75 ? "ok" : "bad"}">${n}</span><div><div class="rev-q">${esc(e.q)} ${tag} — ${e.right}/${e.total}</div><div class="rev-a">${list}</div></div></div>`;
    }
    if (e.type === "ireading") {
      const g = e.gaps.map((x, k) => `${k + 1}) ${x.ok ? `<span class="you-ok">${esc(x.w)}</span>` : `<span class="you-bad">${esc(x.you)}</span> <span class="right">${esc(x.w)}</span>`}`).join(" · ");
      const q = e.qs.map(x => `<div class="rev-a">${esc(x.q)}<br>${x.ok ? `<span class="you-ok">${esc(x.you)}</span>` : `<span class="you-bad">${esc(x.you)}</span><br><span class="right">${esc(x.right)}</span>`}</div>`).join("");
      return `<div class="rev"><span class="rev-dot ${e.acc >= .75 ? "ok" : "bad"}">${n}</span><div><div class="rev-q">${esc(e.q)} ${tag} — ${e.right}/${e.total}</div><div class="rev-a">${g}</div>${q}</div></div>`;
    }
    const m = e.m;
    return `<div class="rev"><span class="rev-dot w">${n}</span><div style="min-width:0"><div class="rev-q">${esc(e.prompt)} ${tag}</div>
      ${e.svg ? `<div style="max-width:220px;border-radius:8px;overflow:hidden;margin:6px 0">${e.svg}</div>` : ""}
      <div class="essay">${esc(e.text || "(пусто)")}</div>
      <div class="rev-a">${m.words} слов (цель ${e.target}+) · ${m.sents} предл. · связки: ${m.links.length ? esc(m.links.join(", ")) : "нет"}</div>
      <div class="ai-box hidden" id="ai${i}"><div class="ai" id="ait${i}"></div></div></div></div>`;
  }

  async function aiCheck(S, btn, note) {
    const sample = await window.claude?.use?.("sample");
    if (!sample) { note.textContent = "ИИ-проверка доступна, только когда страница открыта на claude.ai с аккаунтом Claude."; btn.disabled = true; return; }

      const box = $("ai" + i), out = $("ait" + i);
      box.classList.remove("hidden"); out.textContent = "ИИ проверяет текст…";
      const prompt = `Ты — опытный преподаватель, готовящий к Duolingo English Test. Проверь ответ ученицы на задание по письму.
Задание: ${e.prompt}
Ответ ученицы:
"""${(e.text || "").slice(0, 4000)}"""

<script data-app>
// Sounds (synthesized with Web Audio) and animations, layered over the core without changing it.
(function () {

  function tone(freq, start, dur, type = "sine", vol = 0.18, slide = 0) {
    const c = ac(); if (!c || muted) return;
    const t = c.currentTime + start, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  const SND = {
    correct() { tone(880, 0, 0.14, "triangle", 0.2); tone(1318.5, 0.09, 0.32, "triangle", 0.2); tone(2637, 0.09, 0.2, "sine", 0.04); },
    wrong() { tone(220, 0, 0.16, "square", 0.07, 0.85); tone(185, 0.13, 0.26, "square", 0.07, 0.8); },
    tap() { tone(1500, 0, 0.04, "sine", 0.05, 0.6); },
    start() { [523.25, 659.25, 783.99].forEach((f, i) => tone(f, i * 0.07, 0.18, "triangle", 0.12)); },
    finish() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, i * 0.11, 0.35, "triangle", 0.14)); tone(2093, 0.55, 0.5, "sine", 0.05); },
    tick() { tone(1200, 0, 0.03, "square", 0.025); }

  App.sound = n => SND[n] && SND[n]();
  App.isMuted = () => muted;

  // ---- animation styles ----
  const css = document.createElement("style");
  css.dataset.inj = "1";

  @keyframes fbUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

  .task:nth-child(2){animation-delay:.04s}.task:nth-child(3){animation-delay:.08s}.task:nth-child(4){animation-delay:.12s}.task:nth-child(5){animation-delay:.16s}.task:nth-child(6){animation-delay:.2s}.task:nth-child(7){animation-delay:.24s}
  .res-card:nth-child(2){animation-delay:.1s}.res-card:nth-child(3){animation-delay:.2s}

  .choice.sel,.opt.sel{animation:pop .2s ease-out}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}

  .score{position:relative;border:none!important}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}`;
  document.head.appendChild(css);

  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const box = document.createElement("div"); box.className = "confetti";
    const colors = ["#58cc02", "#1cb0f6", "#ffc800", "#ff4b4b", "#ce82ff", "#ff9600"];
    for (let i = 0; i < 70; i++) {
      const p = document.createElement("i");

    setTimeout(() => box.remove(), 4000);
  }
  App.confetti = confetti;

  // Count a number up from 0 for the results circle.
  function countUp(el, to) {
    const t0 = performance.now(), d = 1100;
    const step = t => { const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(to * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  // ---- hooks into the core ----
  const origFeedback = App.feedback;
  App.feedback = function (ok, html, onGo) {
    App.sound(ok ? "correct" : "wrong");
    if (!ok) { const b = document.getElementById("ebody"); if (b) { b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); } }

  };

  const origResults = App.results;
  App.results = function (S, partial) {
    origResults(S, partial);
    const sc = document.querySelector(".score");
    if (!sc) return;
    const b = sc.querySelector("b"), val = +b.textContent;
    const len = 2 * Math.PI * 70, frac = Math.max(0.03, val / 160);
    sc.insertAdjacentHTML("afterbegin", `<svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="70" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="75" cy="75" r="70" fill="none" stroke="var(--green)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${len}" stroke-dashoffset="${len * (1 - frac)}" style="--len:${len};animation:ring 1.1s cubic-bezier(.3,.7,.3,1)"/></svg>`);
    countUp(b, val);
    App.sound("finish");
    if (!partial) confetti();
  };

  // Tap sounds on choices, selects and options; sound when a section starts; mute button on the hub.
  document.addEventListener("click", e => {
    if (e.target.closest(".choice,.opt,.task,.tab,.tab-link")) App.sound("tap");
  }, true);
  document.addEventListener("change", e => { if (e.target.closest(".sel-row")) App.sound("tap"); }, true);

  const origStart = App.startSection;
  App.startSection = function (id) { App.sound("start"); return origStart(id); };

  const origHub = App.hub;
  App.hub = function () {

    const right = document.querySelector(".topbar-in");

<script data-app>
// Extras: mistakes deck ("Работа над ошибками"), daily streak and XP.
(function () {
  const { esc, store, frame, record, startTimer, stopTimer } = App;
  const $ = id => document.getElementById(id);
  // Local calendar date (toISOString alone gives the UTC date).
  const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  App.today = today;

  // ---------- collect mistakes after every section ----------
  function harvest(S) {
    const deck = store.get("mistakes") || [];
    const add = (w, hint, ctx) => {
      w = String(w || "").trim(); if (!w || /\s/.test(w)) return;
      const ex = deck.find(c => c.w.toLowerCase() === w.toLowerCase());
      if (ex) { ex.streak = 0; ex.misses = (ex.misses || 1) + 1; } else deck.push({ w, hint: hint || "", ctx: ctx || "", streak: 0, misses: 1 });
    };
    S.log.forEach(e => {
      if (e.type === "select" && !e.ok && e.real) add(e.q, BANK.gloss[e.q], "");
      if (e.type === "blanks" && !e.ok) add(e.right, e.tip, e.q);
      if (e.type === "ctest") e.items.filter(x => !x.ok).forEach(x => add(x.w, "", e.q));
      if (e.type === "ireading") e.gaps.filter(x => !x.ok).forEach(x => add(x.w, BANK.gloss[x.w] || "", e.q));
      if (e.type === "review") { const c = deck.find(c => c.w === e.right); if (c) c.streak = e.ok ? c.streak + 1 : 0; }
    });
    store.set("mistakes", deck.filter(c => c.streak < 2));
  }

  // ---------- streak & XP ----------
  function award(S) {
    const d = store.get("days") || [];
    if (d[d.length - 1] !== today()) d.push(today());
    store.set("days", d.slice(-400));
    const graded = S.log.filter(e => typeof e.ok === "boolean");
    const xp = graded.filter(e => e.ok).length * 10 + S.log.filter(e => e.acc !== undefined).reduce((a, e) => a + Math.round(e.acc * 30), 0)
      + S.log.filter(e => e.text !== undefined).reduce((a, e) => a + Math.min(40, e.m.words), 0);
    store.set("xp", (store.get("xp") || 0) + xp);
    const h = store.get("history") || [];
    h.push({ id: S.sec.id, score: App.estimate(S), date: today() });
    store.set("history", h.slice(-300));
    return xp;
  }
  function streak() {
    const d = new Set(store.get("days") || []);
    let n = 0, t = new Date();
    if (!d.has(today())) t.setDate(t.getDate() - 1);
    while (d.has(t.toISOString().slice(0, 10))) { n++; t.setDate(t.getDate() - 1); }
    return n;
  }
  App.streak = streak;

  const origResults = App.results;
  App.results = function (S, partial) {
    let xp = 0;
    if (S.log.length) { harvest(S); xp = award(S); }
    origResults(S, partial);
    const sum = document.querySelector(".stats");
    if (sum && xp) sum.insertAdjacentHTML("beforeend", `<div class="stat" style="border-color:#ffc800"><b style="color:#ff9600">+${xp} XP</b>опыт</div>`);
  };

  // ---------- review section ----------
  App.SECTIONS.push({ id: "review", name: "Работа над ошибками", skill: "review", n: 10, time: 30, hidden: true, desc: "Повторение слов, в которых были ошибки" });
  App.tasks.review = {
    make(level, used) {
      const deck = (store.get("mistakes") || []).filter(c => !used.has(c.w));
      const c = deck.sort((a, b) => (b.misses || 1) - (a.misses || 1))[Math.floor(Math.random() * Math.min(3, deck.length))];
      used.add(c.w); return c;
    },
    render(c) {
      const give = Math.max(1, Math.floor(c.w.length / 3));
      let boxes = `<span class="lb">`;
      for (let i = 0; i < c.w.length; i++) boxes += i < give ? `<span>${esc(c.w[i])}</span>` : `<input maxlength="1" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="letter ${i + 1}">`;
      boxes += `</span>`;
      const ctx = c.ctx && c.ctx.includes("____") ? `<div class="sent" style="margin-bottom:18px">${esc(c.ctx).replace("____", boxes)}</div>` : `<div class="sent" style="text-align:center;margin-bottom:18px">${boxes}</div>${c.ctx ? `<div style="color:var(--muted)">из текста «${esc(c.ctx)}»</div>` : ""}`;
      frame({ body: `<h2 class="qtitle">Вспомните слово</h2>${c.hint ? `<div style="font-size:20px;margin-bottom:22px;background:var(--blue-soft);border-radius:12px;padding:8px 16px">${esc(c.hint)}</div>` : ""}${ctx}`, hint: "Слово уйдёт из колоды после 2 верных ответов подряд" });
      const body = $("ebody"), inputs = [...body.querySelectorAll(".lb input")], btn = $("submit");
      inputs.forEach((inp, k) => {
        inp.oninput = () => { inp.value = inp.value.slice(-1); if (inp.value && inputs[k + 1]) inputs[k + 1].focus(); btn.disabled = !inputs.some(i => i.value); };
        inp.onkeydown = e => { if (e.key === "Backspace" && !inp.value && inputs[k - 1]) { inputs[k - 1].focus(); inputs[k - 1].value = ""; e.preventDefault(); } if (e.key === "Enter" && !btn.disabled) btn.click(); };
      });
      inputs[0] && inputs[0].focus();
      let done = false;
      const check = () => {
        if (done) return; done = true; stopTimer();
        const you = c.w.slice(0, give) + inputs.map(i => i.value || "_").join(""), ok = you.toLowerCase() === c.w.toLowerCase();
        body.querySelector(".lb").classList.add(ok ? "ok" : "bad"); inputs.forEach(i => i.disabled = true); btn.disabled = true;
        record({ type: "review", ok, q: c.hint || c.ctx || c.w, you, right: c.w, tip: c.hint });
        App.feedback(ok, esc(c.w));
      };
      btn.onclick = check;
      startTimer(App.S.sec.time, check);
    }
  };
  App.startReview = function () {
    const n = (store.get("mistakes") || []).length;
    if (!n) return;
    App.SECTIONS.find(s => s.id === "review").n = Math.min(10, n);
    App.startSection("review");
  };
})();

</script>

  // ---------- writing cheat sheet ----------
  const SHEET = [
    ["Write About the Photo · 1 минута", ["In this picture, I can see…", "In the foreground / background, there is…", "On the left / right side…", "It looks like… / It seems that…", "They are probably… because…", "The atmosphere seems calm / busy / cheerful."],
      "Опишите: где это, кто там, что они делают, как выглядят, какое настроение. Старайтесь написать 4–5 предложений, используйте Present Continuous."],
    ["Writing Sample · 5 минут", ["In my opinion, … / I strongly believe that…", "There are two main reasons for this. First,… Second,…", "For example, … / For instance, …", "On the other hand, some people argue that…", "As a result, … / Therefore, …", "In conclusion, …"],
      "Структура: мнение → 2 причины с примерами → другая точка зрения → вывод. Цель — 100+ слов, 6–8 предложений разной длины."],
    ["Interactive Writing · 5 + 3 минуты", ["To answer this question, I would say…", "Personally, I have experienced…", "What I mean is…", "Another important point is…", "Building on my previous answer, …", "To sum up, …"],
      "Во второй части не повторяйте первую: отвечайте прямо на новый вопрос и добавьте личный пример."],
    ["Связки, которые повышают балл", ["however · although · whereas", "moreover · furthermore · in addition", "consequently · as a result · therefore", "for instance · such as · in particular", "despite · in spite of · nevertheless", "overall · to sum up · all in all"],
      "Используйте 3–4 разных связки в каждом тексте, но не начинайте ими каждое предложение."],
    ["Частые ошибки", ["people is → people are", "I am agree → I agree", "more better → better", "in the internet → on the internet", "discuss about → discuss", "depend of → depend on"],
      "Перечитайте текст за 20 секунд до конца таймера и проверьте большие буквы, артикли и окончания -s/-ed."]
  ];
  App.cheatsheet = function () {
    document.getElementById("app").innerHTML = `<div class="res">
      <div class="res-actions" style="margin-bottom:16px"><button class="btn ghost" id="home">← Все разделы</button></div>
      <h1 style="font-size:28px;margin:0 0 16px">Шпаргалка по письму</h1>
      ${SHEET.map(([t, list, tip]) => `<div class="res-card"><h2>${esc(t)}</h2>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">${list.map(p => `<span class="stat" style="font-weight:600">${esc(p)}</span>`).join("")}</div>
        <div class="rev-tip" style="font-size:15px">${esc(tip)}</div></div>`).join("")}
    </div>`;
    window.scrollTo(0, 0);
    $("home").onclick = () => App.hub();
  };

  // ---------- hub: stats in the top bar + tools block ----------
  const origHub = App.hub;
  App.hub = function () {
    origHub();
    const bar = document.querySelector(".topbar-in");
    if (bar) bar.lastElementChild.insertAdjacentHTML("beforebegin",
      `<span style="display:flex;gap:14px;font-weight:800;margin-left:auto;margin-right:12px"><span title="Очки опыта" style="color:#ffc800">⭐ ${store.get("xp") || 0}</span></span>`);
    const n = (store.get("mistakes") || []).length;
    const mocks = store.get("mocks") || [];
    const sec2 = document.querySelector("h2.sec");

    sec2.insertAdjacentHTML("beforebegin", `<h2 class="sec">Подготовка к экзамену</h2><div class="task-list" style="margin-bottom:32px">
      <button class="task" id="t-mock"><span class="task-ico" style="font-size:34px">🎯</span><span class="task-body"><span class="task-name">Пробный экзамен</span>
        <span class="task-desc" style="display:block">Все разделы чтения и письма подряд, около 20 минут${mocks.length ? ` · последний результат ≈${mocks[mocks.length - 1].score}` : ""}</span></span></button>
      <button class="task" id="t-rev" ${n ? "" : "disabled style=\"opacity:.6;cursor:default\""}><span class="task-ico" style="font-size:34px">📕</span><span class="task-body"><span class="task-name">Работа над ошибками</span>
        <span class="task-desc" style="display:block">${n ? `${n} слов из ваших ошибок ждут повторения` : "Здесь появятся слова, в которых вы ошибётесь"}</span></span></button>
      <button class="task" id="t-sheet"><span class="task-ico" style="font-size:34px">📝</span><span class="task-body"><span class="task-name">Шпаргалка по письму</span>
        <span class="task-desc" style="display:block">Шаблоны ответов, связки и частые ошибки</span></span></button>
    </div>`);
    $("t-mock").onclick = App.startMock;
    $("t-rev").onclick = App.startReview;
    $("t-sheet").onclick = App.cheatsheet;
  };
})();
